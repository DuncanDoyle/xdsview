apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-example-com
  namespace: kgateway-system
spec:
  parentRefs:
    - name: gw
      namespace: kgateway-system
  hostnames:
    - "api.example.com"
  rules:
  - backendRefs:
    - name: httpbin
      namespace: httpbin
      port: 8000
      weight: 80
    - name: httpbin-v2
      namespace: httpbin
      port: 8000
      weight: 20
