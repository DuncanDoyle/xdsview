apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-example-com
  namespace: kgateway-system
spec:
  parentRefs:
    - name: gw
      namespace: kgateway-system
  hostnames:
    - "api.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: httpbin
      namespace: httpbin
      port: 8000
  - matches:
    - path:
        type: PathPrefix
        value: /web
    - headers:
      - name: x-version
        value: v2
    backendRefs:
    - name: httpbin-v2
      namespace: httpbin
      port: 8000
  - backendRefs:
    - name: httpbin
      namespace: httpbin
      port: 8000
