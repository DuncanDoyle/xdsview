apiVersion: v1
kind: Service
metadata:
  name: ratelimit
  namespace: kgateway-system
spec:
  ports:
  - name: grpc
    port: 4444
    appProtocol: kubernetes.io/h2c
  selector:
    app: ratelimit
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: ratelimit
  namespace: kgateway-system
spec:
  type: RateLimit
  rateLimit:
    domain: api-example-com
    grpcService:
      backendRef:
        name: ratelimit
        port: 4444
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: rate-limit
  namespace: kgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: api-example-com
  rateLimit:
    global:
      extensionRef:
        name: ratelimit
      descriptors:
      - entries:
        - type: Header
          header: X-Custom
